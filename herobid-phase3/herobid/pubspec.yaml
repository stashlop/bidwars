name: herobid
description: Real-time multiplayer character-auction battle game.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_database: ^11.0.0
  firebase_storage: ^12.0.0
  cloud_functions: ^5.0.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.0

  # State management & navigation
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0

  # UI
  google_fonts: ^6.2.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0

  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.0
  crypto: ^3.0.3 # Apple sign-in nonce hashing (Phase 3)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
